spring.application.name=t24r-signing-api
server.port=8080
debug=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO

# Keep local data across application restarts. The path is relative to the backend working directory.
# Override with SPRING_DATASOURCE_URL when a disposable or external database is required.
spring.datasource.url=jdbc:h2:file:./data/database/t24r_signing;MODE=Oracle;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics

app.cors.allowed-origins=http://localhost:4200,http://localhost:4300
app.security.admin-username=admin
app.security.admin-password=admin123
app.security.default-api-key=dev-api-key-t24r
app.security.default-api-client-id=partner-sandbox
app.mock.seed-records=14
app.storage.root-path=./data/digital-signing
app.outbox.max-retries=3
app.outbox.poller.enabled=false
